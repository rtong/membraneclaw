[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swro-auto-evaluate"
version = "0.1.0"
description = "Reproducible step-level evaluation for SWRO WaterTAP agents"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

