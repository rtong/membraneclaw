name: Runtime, tracing and provider contracts
on:
  push:
    paths: ['membraneclaw_runtime/**', 'tests/tracing/**', 'tests/providers/**', 'tests/runtime/**', 'tests/rsi/**', 'experiments/auto-evaluate/**', 'agent/**', 'docs/**', '*README.md', 'server.py', 'cli.py', 'pyproject.toml', '.github/workflows/tracing.yml']
  pull_request:
    paths: ['membraneclaw_runtime/**', 'tests/tracing/**', 'tests/providers/**', 'tests/runtime/**', 'tests/rsi/**', 'experiments/auto-evaluate/**', 'agent/**', 'docs/**', '*README.md', 'server.py', 'cli.py', 'pyproject.toml', '.github/workflows/tracing.yml']
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[tools,http,legacy-test]"
      - run: python -m compileall -q membraneclaw_runtime
      - run: python -m unittest discover -s tests/tracing -v
      - run: python -m unittest discover -s tests/providers/contract -v
      - run: python -m unittest discover -s tests/runtime -v
      - run: python -m unittest discover -s tests/rsi -v
      - run: python agent/test_google_tools.py
      - run: python agent/test_google_oauth.py
      - run: python agent/test_identity.py
      - run: python mcp_rocalc/test_rocalc.py
      - name: Verify installed distribution outside source checkout
        working-directory: /tmp
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests/providers/contract" -v
      - name: Verify installed runtime outside source checkout
        working-directory: /tmp
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests/runtime" -v
      - name: Verify installed RSI outside source checkout
        working-directory: /tmp
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests/rsi" -v
      - name: Install evaluation package
        run: |
          python -m pip install --no-deps -e experiments/auto-evaluate
          python -m pip install 'openpyxl>=3.1,<4'
      - name: Evaluation regression tests
        run: python -m unittest discover -s experiments/auto-evaluate/tests -v
