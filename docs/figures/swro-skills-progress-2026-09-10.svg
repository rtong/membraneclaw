<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Two separate improvements in the SWRO agent</title><desc id="figure-desc">First engineering tools are added to the 9B model. Then the Solver Skill is tested while keeping those tools fixed.</desc>
<style>
text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#667085}.axis{font-size:12px;fill:#667085}.label{font-size:14px}.value{font-size:13px;font-weight:700}.group{font-size:12px;font-weight:700;fill:#667085;letter-spacing:.04em}.grid{stroke:#d0d5dd;stroke-width:1}.frame{stroke:#98a2b3;stroke-width:1;fill:none}
</style><rect width="100%" height="100%" fill="#ffffff"/><text class="title" x="48" y="44">Two separate improvements in the SWRO agent</text><text class="subtitle" x="48" y="70">Stage A adds tools to the 9B model. Stage B keeps those tools and adds only the Solver Skill.</text><text class="label" x="48" y="112" font-weight="700">Stage A: Add engineering tools (117 cases)</text><text class="value" x="568" y="138" text-anchor="end" fill="#15803d">+31.44 from tools</text><text class="label" x="48" y="182">9B only</text><rect x="258" y="164" width="300" height="26" rx="4" fill="#eef2f6"/><rect x="258" y="164" width="77.5" height="26" rx="4" fill="#64748b"/><text class="value" x="568" y="182" text-anchor="end">25.84</text><text class="label" x="48" y="254">9B + WaterTAP tools</text><rect x="258" y="236" width="300" height="26" rx="4" fill="#eef2f6"/><rect x="258" y="236" width="171.8" height="26" rx="4" fill="#0f766e"/><text class="value" x="568" y="254" text-anchor="end">57.27</text><text class="label" x="48" y="326">9B + tools + RAG</text><rect x="258" y="308" width="300" height="26" rx="4" fill="#eef2f6"/><rect x="258" y="308" width="165.0" height="26" rx="4" fill="#0891b2"/><text class="value" x="568" y="326" text-anchor="end">55.01</text><text class="subtitle" x="258" y="404">0</text><text class="subtitle" x="558" y="404" text-anchor="end">100</text><text class="label" x="598" y="112" font-weight="700">Stage B: Add Solver Skill on top (3 cases)</text><text class="value" x="1118" y="138" text-anchor="end" fill="#15803d">+9.50 from Solver Skill</text><text class="label" x="598" y="182">9B + tools, no Skill</text><rect x="808" y="164" width="300" height="26" rx="4" fill="#eef2f6"/><rect x="808" y="164" width="235.0" height="26" rx="4" fill="#64748b"/><text class="value" x="1118" y="182" text-anchor="end">78.33</text><text class="label" x="598" y="254">9B + tools + Solver Skill</text><rect x="808" y="236" width="300" height="26" rx="4" fill="#eef2f6"/><rect x="808" y="236" width="263.5" height="26" rx="4" fill="#7c3aed"/><text class="value" x="1118" y="254" text-anchor="end">87.83</text><text class="subtitle" x="808" y="404">0</text><text class="subtitle" x="1108" y="404" text-anchor="end">100</text><text class="subtitle" x="48" y="450">Stage A uses mean scores over 117 D1-D6 cases. Stage B uses mean per-case best-of-3 over D6-6c-02/03/06.</text></svg>